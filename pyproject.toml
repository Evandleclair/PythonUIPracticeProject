[project]
name = "python-ui-practice"
version = "0.1.0"
description = "Test project for python UI integration"
authors = [
    {name = "Evan LeClair",email = "103522116+Evandleclair@users.noreply.github.com"}
]
license = "Creative Commons Zero v1.0 Universal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyqt5 (>=5.15.11,<6.0.0)",
